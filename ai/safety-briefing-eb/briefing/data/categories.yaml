# 12개 안전 카테고리 (명세 §6.1 표 그대로 이관)
#
# 체크리스트는 LLM 자유 생성이 아니라 이 체계에 정박(anchor)한다.
# generation_criteria 가 곧 프롬프트에 주입되는 생성 기준이다.
# max_items 는 카테고리당 상한(1~3). 전체 상한은 config.yaml 의 max_total_items.
#
# default_priority 에 대하여:
#   critical 은 "필요=Y, 확인=N"(미이행 안전조치)에서 승격되어 붙는 것이 원칙이다 (§6.2 표4).
#   기본값부터 critical 로 깔면 대부분의 항목이 critical 이 되어 신호가 죽는다.
#   따라서 명세가 예시로 명시한 GAS_ATMOSPHERE 와, 진입 자체가 생명 위험인
#   CONFINED_SPACE 만 critical 로 두고 나머지는 normal 로 둔다.
#   TODO(팀확인): 조선소 현장 기준으로 이 두 개 외에 항시 critical 로 볼 카테고리가 있는지.

- code: RISK_ASSESSMENT
  name_ko: 작업 전 위험성 평가
  generation_criteria:
    - 작업절차
    - 작업조건 변화
    - 주요 위험요인
    - 사전 확인사항
  default_priority: normal
  max_items: 2

- code: WORK_AREA_CONTROL
  name_ko: 작업구역 및 출입통제
  generation_criteria:
    - 작업구역 설정
    - 경고표지
    - 바리케이드
    - 비인가자 출입통제
  default_priority: normal
  max_items: 2

- code: FIRE_EXPLOSION
  name_ko: 화재·폭발 예방
  generation_criteria:
    - 가연물 제거
    - 불티 비산 방지
    - 소화기 배치
    - 점화원 관리
  default_priority: normal
  max_items: 3

- code: GAS_ATMOSPHERE
  name_ko: 가스농도 및 작업환경 측정
  generation_criteria:
    - 산소·가연성·유해가스 측정
    - 측정시간 및 허용기준 확인
  default_priority: critical
  max_items: 3

- code: HAZARDOUS_MATERIAL
  name_ko: 위험물질 및 압력 관리
  generation_criteria:
    - 위험물질 제거
    - 압력 방출
    - 용기 세정
    - 누출 방지
  default_priority: normal
  max_items: 2

- code: ENERGY_ISOLATION
  name_ko: 에너지 차단 및 설비 격리
  generation_criteria:
    - 전원·밸브 차단
    - 맹판 설치
    - 잠금장치
    - 차단표지 부착
  default_priority: normal
  max_items: 2

- code: VENTILATION_LIGHTING
  name_ko: 환기·조명 및 작업환경
  generation_criteria:
    - 환기장비
    - 불활성가스 치환
    - 작업 조명
    - 주변 환경 상태
  default_priority: normal
  max_items: 2

- code: PPE_SAFETY_EQUIPMENT
  name_ko: 개인보호구 및 안전장비
  generation_criteria:
    - 보호구 착용
    - 안전장비 배치
    - 장비 상태와 사용 가능 여부
  default_priority: normal
  max_items: 2

- code: CONFINED_SPACE
  name_ko: 밀폐공간 작업
  generation_criteria:
    - 통신수단
    - 감시인
    - 구명장구
    - 송기마스크
    - 구조계획
  default_priority: critical
  max_items: 3

- code: WORK_AT_HEIGHT
  name_ko: 고소작업 및 추락 방지
  generation_criteria:
    - 작업발판
    - 안전난간
    - 안전대
    - 추락방지망
    - 낙하물 방지
  default_priority: normal
  max_items: 3

- code: EXCAVATION_HEAVY_EQUIPMENT
  name_ko: 굴착·중장비 및 설비 간섭
  generation_criteria:
    - 매설설비
    - 장비 자격
    - 신호수
    - 지반·기상
    - 전선·설비 간섭
  default_priority: normal
  max_items: 3

- code: SPECIAL_EMERGENCY
  name_ko: 특수작업 및 비상대응
  generation_criteria:
    - 방사선 작업
    - 작업중지 기준
    - 비상연락·대피·구조
    - 작업 후 복원
  default_priority: normal
  max_items: 2
