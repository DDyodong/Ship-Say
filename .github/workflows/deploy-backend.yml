name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "ai/permit_analysis/**"
      - "Dockerfile.backend"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: safety-backend
  ECS_CLUSTER: safety-backend-cluster
  ECS_SERVICE: safety-backend-service
  ECS_TASK_DEFINITION: safety-backend-task
  CONTAINER_NAME: safety-backend
  ANALYSIS_CONTAINER_NAME: permit-analysis

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::013459780957:role/GitHubActionsBackendDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          BACKEND_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          ANALYSIS_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-permit-analysis"

          docker build \
            -f Dockerfile.backend \
            -t "$BACKEND_IMAGE_URI" \
            .
          docker build \
            -f ai/permit_analysis/Dockerfile \
            -t "$ANALYSIS_IMAGE_URI" \
            ai/permit_analysis

          docker push "$BACKEND_IMAGE_URI"
          docker push "$ANALYSIS_IMAGE_URI"

          echo "backend-image=$BACKEND_IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "analysis-image=$ANALYSIS_IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition-original.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition-original.json > task-definition.json

      - name: Add permit analysis sidecar
        env:
          ANALYSIS_IMAGE_URI: ${{ steps.build-image.outputs.analysis-image }}
        run: |
          jq \
            --arg backend "$CONTAINER_NAME" \
            --arg analysis "$ANALYSIS_CONTAINER_NAME" \
            --arg image "$ANALYSIS_IMAGE_URI" \
            --arg health "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=2)'" \
            '
              (.containerDefinitions[] | select(.name == $backend) | .logConfiguration // null) as $backendLogs
              | .containerDefinitions |= (
                  map(
                    if .name == $backend then
                      .environment = (
                        ((.environment // [])
                          | map(select(
                              .name != "PERMIT_ANALYSIS_AI_URL"
                              and .name != "PERMIT_ANALYSIS_AI_ENABLED"
                            )))
                        + [
                            {"name": "PERMIT_ANALYSIS_AI_ENABLED", "value": "true"},
                            {"name": "PERMIT_ANALYSIS_AI_URL", "value": "http://127.0.0.1:8001"}
                          ]
                      )
                      | .dependsOn = (
                          ((.dependsOn // []) | map(select(.containerName != $analysis)))
                          + [{"containerName": $analysis, "condition": "START"}]
                        )
                    elif .name == $analysis then
                      .image = $image
                      | .essential = false
                      | .healthCheck = {
                          "command": ["CMD-SHELL", $health],
                          "interval": 10,
                          "timeout": 5,
                          "retries": 5,
                          "startPeriod": 20
                        }
                    else . end
                  )
                  | if any(.name == $analysis) then . else
                      . + [(
                        {
                          "name": $analysis,
                          "image": $image,
                          "essential": false,
                          "healthCheck": {
                            "command": ["CMD-SHELL", $health],
                            "interval": 10,
                            "timeout": 5,
                            "retries": 5,
                            "startPeriod": 20
                          }
                        }
                        + if $backendLogs == null then {} else {
                            "logConfiguration": (
                              $backendLogs
                              | .options["awslogs-stream-prefix"] = "permit-analysis"
                            )
                          } end
                      )]
                    end
                )
            ' task-definition.json > task-definition-with-analysis.json

      - name: Update image in task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-with-analysis.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.backend-image }}

      - name: Deploy task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
