name: safety-ai-control

services:
  mysql:
    image: mysql:8.4
    container_name: safety-ai-mysql
    environment:
      MYSQL_DATABASE: safety_smartyard_control
      MYSQL_USER: admin123
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: local_root_only
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-signup-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_only"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: safety-ai-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/safety_smartyard_control?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: admin123
      DB_PASSWORD: admin123
      FILE_STORAGE_TYPE: local
      UPLOAD_DIR: /app/uploads
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-관리자}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-aivle25}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
    ports:
      - "${BACKEND_PORT:-8180}:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safety-ai-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8180}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-signup-data:
  backend-uploads:
  frontend-node-modules:
